name: Generate stats card

on:
  schedule:
    - cron: "0 */12 * * *"  # Fixed: run at minute 0, not every minute
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: anuraghazra/github-readme-stats@master
        with:
          username: ${{ github.repository_owner }}
          hide_title: false
          hide_rank: false
          show_icons: true
          include_all_commits: true
          count_private: true
          disable_animations: false
          theme: dark
          locale: en
          hide_border: false
          output: dist/stats.svg

      - name: Push to stats-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
